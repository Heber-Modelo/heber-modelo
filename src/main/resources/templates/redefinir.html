<!doctype html>
<html lang="pt-br" xmlns="http://www.w3.org/1999/xhtml">
  <head>
    <!--suppress HtmlUnknownTag -->
    <th:block th:replace="~{fragments/head :: head}"></th:block>
    <link rel="stylesheet" th:href="@{/css/formulario.css}" />
    <title th:text="#{web.page.reset-password.title}"></title>
    <meta name="_csrf" th:content="${_csrf.token}" />
  </head>

  <body>
    <header th:replace="~{fragments/header :: header}"></header>
    <main>
      <form action="/redefinir" method="post" th:object="${usuario}">
        <div
          class="aviso"
          th:text="#{web.page.reset-password.user-not-found}"
          th:if="${param.userNotFound}"
        ></div>
        <div
          class="aviso"
          th:text="#{web.page.reset-password.passwords-differ}"
          th:if="${param.mismatch}"
        ></div>
        <label>
          <span class="campos-texto" th:text="#{web.page.reset-password.label.username}"></span>
          <input type="text" name="username" />
        </label>
        <label>
          <span class="campos-texto" th:text="#{web.page.reset-password.label.new-password}"></span>
          <input type="password" name="senhaNova" required />
        </label>
        <label>
          <span
            class="campos-texto"
            th:text="#{web.page.reset-password.label.confirm-password}"
          ></span>
          <input type="password" name="confirmarSenha" required />
        </label>
        <button th:text="#{web.page.reset-password.label.button.continue}" id="continuar"></button>
        <small>
          <span>
            <th:block th:text="#{web.page.reset-password.privacy-notice.1}"></th:block>&nbsp;
            <a
              href="privacidade.html"
              th:text="#{web.page.reset-password.privacy-notice.2}"
              id="politica"
            ></a>
            .
          </span>
        </small>
        <input th:name="${_csrf.parameterName}" th:value="${_csrf.token}" type="hidden" />
      </form>
    </main>
    <div th:replace="~{fragments/cookiesBanner :: #cookies-banner}"></div>
    <footer th:replace="~{fragments/licenseFooter :: footer}"></footer>
  </body>
</html>
