<!doctype html>
<html lang="pt-br" xmlns="http://www.w3.org/1999/xhtml">
  <head>
    <th:block th:replace="~{fragments/head :: head}"></th:block>
    <link rel="stylesheet" th:href="@{/css/listagemEstudantes.css}" />
    <title th:text="#{web.page.students-list.title}"></title>
    <script th:src="@{/javascript/listagemEstudantes.js}" defer></script>
    <meta name="_csrf" th:content="${_csrf.token}" />
  </head>
  <body>
    <!--

    <header>
      <button id="home">
        <a th:href="@{index.html}" title="Home">
          <th:block th:replace="~{fragments/listagemEstudantes/icons/home :: svg}"></th:block>
        </a>
      </button>
      <h1 th:text="${programa}"></h1>
      <div id="opcoes-botoes">
        <button>
          <th:block th:replace="~{fragments/listagemEstudantes/icons/notify :: svg}"></th:block>
        </button>
        <button>
          <a th:href="@{configurarSessao.html}" th:title="#{web.page.session-configuration.title}">
            <th:block th:replace="~{fragments/listagemEstudantes/icons/config :: svg}"></th:block>
          </a>
        </button>
      </div>
    </header>
    <main>
      <div id="await-indicator-wrapper" style="display: none">
        <div id="await-indicator" th:text="#{session.waiting.connections}"></div>
      </div>
      <h2 th:text="#{web.page.students-list.label.professors}"></h2>
      <hr />
      <div
        class="user-data"
        th:each="professor : ${professors}"
        th:title="${professor.getMatricula()}"
      >
        <a
          th:href="'perfil/' + ${professor.getMatricula()}"
          th:insert="~{fragments/listagemEstudantes/icons/profile :: svg}"
        ></a>
        <span th:text="${professor.getNome()}"></span>
        <a th:href="'mailto:' + ${professor.getEmail()}">
          <th:block th:replace="~{fragments/listagemEstudantes/icons/email :: svg}"></th:block>
        </a>
      </div>
      <h2 th:text="#{web.page.students-list.label.students}"></h2>
      <hr />
      <div class="user-data" th:each="student : ${students}" th:title="${student.getMatricula()}">
        <a
          th:href="'perfil/' + ${student.getMatricula()}"
          th:insert="~{fragments/listagemEstudantes/icons/profile :: svg}"
        ></a>
        <span th:text="${student.getNome()}"></span>
        <a th:href="'mailto:' + ${student.getEmail()}">
          <th:block th:replace="~{fragments/listagemEstudantes/icons/email :: svg}"></th:block>
        </a>
      </div>
      <div>
        <button id="encerrarSessao">
          <a th:text="#{web.page.students-list.label.close-session}"></a>
        </button>
        <button>
          <a
            th:href="@{listagemAtividades.html}"
            th:text="#{web.page.students-list.label.assignments}"
          ></a>
        </button>
      </div>
    </main>
  </body>
</html>
