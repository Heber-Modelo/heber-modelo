<!doctype html>
<html lang="pt-br" xmlns="http://www.w3.org/1999/xhtml">
  <head>
    <th:block th:replace="~{fragments/head :: head}"></th:block>
    <title th:text="#{web.page.assignments-list.title}"></title>
    <link rel="stylesheet" th:href="@{/css/listagemAtividades.css}" />
    <title th:text="#{web.page.assignments-list.title}"></title>
  </head>
  <body>
    <!--

    <header th:replace="~{fragments/header :: header}"></header>
    <main>
      <div class="atividades">
        <a
          th:each="atividade : ${atividades}"
          th:href="'atividade/' + ${atividade.getCodigo()}"
          class="label-atividade"
        >
          <div class="icon-title">
            <th:block th:replace="~{fragments/assignment/icons/assignment_icon :: svg}"></th:block>
            <span th:text="${atividade.getTitulo()}"></span>
          </div>
          <label>
            <span th:text="#{web.page.assignment.label.deadline}"></span>
            <input type="datetime-local" th:value="${atividade.getDataLimite()}" readonly />
          </label>
        </a>
      </div>

      <div class="botoes">
        <button class="backwards">
          <a th:href="@{listagemEstudantes.html}">
            <th:block th:replace="~{fragments/assignment/icons/leftward_icon :: svg}"></th:block>
          </a>
        </button>
        <button>
          <a
            th:href="@{listagemAtividadesCorrecao.html}"
            th:text="#{web.page.assignments-list.label.feedback-list}"
          ></a>
        </button>
        <button>
          <a
            th:href="@{criarAtividade.html}"
            th:text="#{web.page.assignments-list.label.attach}"
          ></a>
        </button>
      </div>
    </main>
  </body>
</html>
