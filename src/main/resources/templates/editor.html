<!doctype html>
<html lang="pt-br" xmlns="http://www.w3.org/1999/xhtml">
  <head>
    <th:block th:replace="~{fragments/head :: head}"></th:block>
    <th:block th:insert="~{fragments/bindings :: script}"></th:block>
    <link rel="stylesheet" th:href="@{/css/editor.css}" />
    <script th:src="@{/javascript/application/paginas/editor/callbacksElementos.js}"></script>
    <script th:src="@{/javascript/application/paginas/editor/grade.js}"></script>
    <script th:src="@{/javascript/editor.js}" type="module" defer></script>
    <script th:src="@{/javascript/helperAbrirNovoArquivo.js}" defer></script>
    <script th:src="@{/javascript/helperEditorDescricaoModeloRelacional.js}" defer></script>
    <script th:src="@{/javascript/helperSeletorTipoDiagrama.js}" defer></script>
    <script th:src="@{/javascript/mostrarAtividades.js}" defer></script>
    <script th:src="@{/javascript/salvar.js}" defer></script>
    <script>
      configurarGrade("--espessura-grade", "[(${espessuraGrade})]");
      configurarGrade("--tamanho-quadrado-grade", "[(${tamanhoQuadradoGrade})]");
      incrementoMovimentacao = Number("[(${incrementoMovimentacaoElemento})]");
      utilizarAbasExclusivas = "[(${abasExclusivas})]" === "true";
    </script>
    <meta name="_csrf" th:content="${_csrf.token}" />
    <meta name="_csrf_headerName" th:content="${_csrf.headerName}" />
    <title th:text="#{web.page.editor.title}"></title>
  </head>
  <body>
    <!--

    <header>
      <button>
        <a th:href="@{index.html}" title="Home">
          <th:block th:insert="~{fragments/common/icons/home.html}"></th:block>
        </a>
      </button>
      <details class="header-item" id="assignments" th:if="${mostrarAtividades}">
        <summary th:text="#{web.page.editor.assignments.title}"></summary>
      </details>
      <input type="radio" name="toolbar-menu" id="menu-fechado" checked />
      <div class="menu file">
        <input type="radio" name="toolbar-menu" id="file-menu" />
        <label for="file-menu" class="menu-titulo menu-abrir">
          <span th:text="#{web.page.editor.file}"></span>
        </label>
        <label for="menu-fechado" class="menu-titulo menu-fechar">
          <span th:text="#{web.page.editor.file}"></span>
        </label>
        <div class="mostrar">
          <span th:text="#{web.page.editor.toolbar.item.new-file}" id="novo"></span>
          <span th:text="#{web.page.editor.toolbar.item.open-file}" id="abrir"></span>
          <input type="radio" name="file-submenu" id="submenu-fechado" checked />
          <div class="submenu">
            <input type="radio" name="file-submenu" id="submenu-salvar" />
            <label for="submenu-salvar" class="submenu-titulo submenu-abrir">
              <span th:text="#{web.page.editor.toolbar.item.save-file}"></span>
              <span class="seta">›</span>
            </label>
            <label for="submenu-fechado" class="submenu-titulo submenu-fechar">
              <span th:text="#{web.page.editor.toolbar.item.save-file}"></span>
              <span class="seta">›</span>
            </label>
            <div class="submenu-mostrar">
              <span>XML</span>
              <span>JSON</span>
              <span>TXT</span>
            </div>
          </div>
          <div class="submenu">
            <input type="radio" name="file-submenu" id="submenu-exportar" />
            <label for="submenu-exportar" class="submenu-titulo submenu-abrir">
              <span th:text="#{web.page.editor.toolbar.item.export-file}"></span>
              <span class="seta">›</span>
            </label>
            <label for="submenu-fechado" class="submenu-titulo submenu-fechar">
              <span th:text="#{web.page.editor.toolbar.item.export-file}"></span>
              <span class="seta">›</span>
            </label>
            <div class="submenu-mostrar">
              <span>PNG</span>
              <span>PDF</span>
              <span>SVG</span>
            </div>
          </div>
          <span th:text="#{web.page.editor.toolbar.item.print-file}" id="imprimir"></span>
          <span th:text="#{web.page.editor.toolbar.item.import-file}" id="importar"></span>
        </div>
      </div>
      <div class="menu edit">
        <input type="radio" name="toolbar-menu" id="edit-menu" />
        <label for="edit-menu" class="menu-titulo menu-abrir">
          <span th:text="#{web.page.editor.edit}"></span>
        </label>
        <label for="menu-fechado" class="menu-titulo menu-fechar">
          <span th:text="#{web.page.editor.edit}"></span>
        </label>
        <div class="mostrar">
          <span th:text="#{web.page.editor.toolbar.copy}" id="copiar"></span>
          <span th:text="#{web.page.editor.toolbar.paste}" id="colar"></span>
          <span th:text="#{web.page.editor.toolbar.cut}" id="cortar"></span>
          <span th:text="#{web.page.editor.toolbar.undo}" id="desfazer"></span>
          <span th:text="#{web.page.editor.toolbar.redo}" id="refazer"></span>
          <span th:text="#{web.page.editor.toolbar.erase}" id="apagar"></span>
          <span th:text="#{web.page.editor.toolbar.delete}" id="deletar"></span>
        </div>
      </div>
      <label for="menu-fechado" class="fechar-fora"></label>
      <h1 th:text="${programa}"></h1>
    </header>
    <section id="atividades" th:if="${mostrarAtividades}">
      <button
        type="button"
        id="clean-selection-button"
        th:text="#{web.page.editor.assignments.clean-selection.label}"
      ></button>
      <button
        type="button"
        id="close-button"
        th:text="#{web.page.editor.assignments.close.label}"
      ></button>
      <h2 th:text="#{web.page.editor.assignments.title}" id="assignments-title"></h2>
      <div id="assignments-list" th:if="${!atividades.isEmpty()}">
        <details th:each="atividade : ${atividades}">
          <summary>
            <span class="title" th:text="${atividade.getTitulo()}"></span>
            <label class="publication-date">
              <span th:text="#{web.page.assignment.label.publication-date}"></span>
              <input type="datetime-local" th:value="${atividade.getDataPostagem()}" />
            </label>
            <label class="deadline">
              <span th:text="#{web.page.assignment.label.deadline}"></span>
              <input type="datetime-local" th:value="${atividade.getDataLimite()}" />
            </label>
            <label class="is-selected">
              <span th:text="#{web.page.editor.assignments.selected.label}"></span>
              <input name="selected-assignment" type="radio" th:value="${atividade.getCodigo()}" />
            </label>
          </summary>
          <p class="assignment-description" th:text="${atividade.getDescricao()}"></p>
          <div class="feedbacks-list" th:if="${feedbacks.get(atividade.getCodigo())}">
            <h3 th:text="#{web.page.editor.assignments.feedbacks.label}"></h3>
            <div th:each="feedback : ${feedbacks.get(atividade.getCodigo())}">
              <p th:text="${feedback.getDescricao()}"></p>
            </div>
          </div>
        </details>
      </div>
      <h2 th:text="#{web.page.editor.assignments.tests.title}" id="tests-title"></h2>
      <div id="tests-list" th:if="${!provas.isEmpty()}">
        <details th:each="prova : ${provas}">
          <summary>
            <span th:text="${prova.getTitulo()}"></span>
            <label class="publication-date">
              <span th:text="#{web.page.assignment.label.publication-date}"></span>
              <input type="datetime-local" th:value="${prova.getDataPostagem()}" />
            </label>
            <label class="deadline">
              <span th:text="#{web.page.assignment.label.deadline}"></span>
              <input type="datetime-local" th:value="${prova.getDataLimite()}" />
            </label>
          </summary>
          <p class="assignment-description" th:text="${prova.getDescricao()}"></p>
          <div class="feedbacks-list">
            <h3 th:text="#{web.page.editor.assignments.feedbacks.label}"></h3>
            <div th:each="feedback : ${feedbacks.get(prova.getCodigo())}">
              <p th:text="${feedback.getDescricao()}"></p>
            </div>
          </div>
          <button
            type="button"
            th:if="${feedbacks.get(prova.getCodigo()).isEmpty()}"
            th:text="#{web.page.editor.assignments.begin-test.label}"
          ></button>
        </details>
      </div>
    </section>
    <aside id="painel-esquerdo">
      <button type="button" class="btn-painel-esquerdo btn-esconder">&lt;</button>
      <button type="button" class="btn-painel-esquerdo btn-mostrar">&gt;</button>
      <section id="diagramas" class="pagina">
        <h2 th:text="#{web.page.editor.section.diagrams}"></h2>
        <section id="banco-de-dados">
          <h2 th:text="#{web.page.editor.section.diagramas.others}"></h2>
          <label th:each="d : ${diagramasBD}" th:title="${d.getTitulo()}">
            <input class="carregar-diagrama" type="checkbox" th:value="${d.getValor()}" />
            <span class="traco">-</span>
            <span th:text="${d.getNome()}"></span>
          </label>
        </section>
      </section>
      <section id="componentes" class="pagina">
        <h2 th:text="#{web.page.editor.section.components}"></h2>
      </section>
    </aside>
    <aside id="painel-direito">
      <button type="button" class="btn-painel-direito btn-esconder">&gt;</button>
      <button type="button" class="btn-painel-direito btn-mostrar">&lt;</button>
      <section id="seletor-tipos-conexao" class="pagina">
        <h2 th:text="#{web.page.editor.section.type-selector}"></h2>
      </section>
      <section id="atividade-selecionada" class="pagina" th:if="${mostrarAtividades}">
        <h2>
          <span th:text="#{web.page.editor.selected-assignment.title}"></span>&nbsp;
          <span id="titulo-atividade"></span>
        </h2>
        <input type="hidden" id="codigo-atividade" />
        <label>
          <span th:text="#{web.page.editor.selected-assignment.label.deadline}"></span>
          <input type="datetime-local" id="data-entrega-atividade" readonly />
        </label>
        <p id="descricao-atividade"></p>
        <button
          type="button"
          id="btn-enviar-atividade"
          th:text="#{web.page.editor.selected-assignment.label.submit}"
        ></button>
      </section>
      <section id="propriedades" class="pagina">
        <h2 th:text="#{web.page.editor.section.properties}"></h2>
        <label th:if="${modoAvancadoEditorPropriedades}">
          <th:block th:text="#{web.page.editor.section.properties.x}"></th:block>
          <input type="text" name="componente-x" />
        </label>
        <label th:if="${modoAvancadoEditorPropriedades}">
          <th:block th:text="#{web.page.editor.section.properties.y}"></th:block>
          <input type="text" name="componente-y" />
        </label>
        <label th:if="${modoAvancadoEditorPropriedades}">
          <th:block th:text="#{web.page.editor.section.properties.height}"></th:block>
          <input type="text" name="componente-altura" />
        </label>
        <label th:if="${modoAvancadoEditorPropriedades}">
          <th:block th:text="#{web.page.editor.section.properties.width}"></th:block>
          <input type="text" name="componente-largura" />
        </label>
        <label>
          <th:block th:text="#{web.page.editor.section.properties.fontsize}"></th:block>
          <input type="text" name="componente-tamanho-fonte" />
        </label>
      </section>
    </aside>
    <main>
      <div
        id="pdf-loader-indicator"
        style="display: none"
        th:text="#{web.page.editor.generating-pdf}"
      ></div>
      <div
        class="info-diagrama"
        id="tipos-diagrama"
        style="display: none"
        th:text="${novoDiagramaDTO.getTiposDiagrama()}"
      ></div>
      <div class="seta seta-superior" style="rotate: 270deg"></div>
      <div class="seta seta-inferior" style="rotate: -270deg"></div>
      <div class="seta seta-direita"></div>
      <div class="seta seta-esquerda" style="rotate: 180deg"></div>
      <div id="seta-placeholder" style="display: none; position: absolute">X</div>
    </main>
    <div th:replace="~{fragments/cookiesBanner :: #cookies-banner}"></div>
    <footer>
      <div>
        <div class="aba" data-indice-aba="1">
          <p
            class="numero-aba"
            contenteditable="plaintext-only"
            th:text="'1 - ' + #{web.page.editor.label.default-tab}"
          ></p>
        </div>
      </div>
      <div class="aba" id="nova-aba">+</div>
    </footer>
  </body>
</html>
