    <th:block th:replace="~{fragments/head :: head}"></th:block>
    <link rel="stylesheet" th:href="@{/css/formulario.css}" />
  </head>

    <header th:replace="~{fragments/header :: header}"></header>
    <main>
      <form action="/configurarSessao" method="post">
        <label>
          <span class="campos-texto" th:text="#{session.config.change-password-token}"></span>
          <input type="text" th:value="${tokenTrocarSenha}" readonly />
        </label>
        <label>
          <span class="campos-texto" th:text="#{session.config.test-lose-focus-timeout}"></span>
          <input th:name="secondsTimeout" th:value="${configuracao.getSecondsTimeout()}" required />
        </label>
        <div id="botoes">
          <button type="button">
            <a
              th:href="@{listagemEstudantes.html}"
              th:text="#{web.page.session-configuration.label.cancel}"
            ></a>
          </button>
          <button type="submit" th:text="#{web.page.session-configuration.label.save}"></button>
        </div>
        <input th:name="${_csrf.parameterName}" th:value="${_csrf.token}" type="hidden" />
      </form>
    </main>
  </body>
</html>
