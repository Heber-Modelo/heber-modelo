<!doctype html>
<html lang="pt-br" xmlns="http://www.w3.org/1999/xhtml">
  <head>
    <th:block th:replace="~{fragments/head :: head}"></th:block>
    <title th:text="#{web.page.session-configuration.title}"></title>
    <link rel="stylesheet" th:href="@{/css/configurarSessao.css}" />
  </head>
  <body>
    <!--

    <header th:replace="~{fragments/header :: header}"></header>
    <main>
      <form>
        <div th:each="atributo : ${configuracao.getAtributos()}">
          <label>
            <span th:text="#{${atributo.getChaveI18N()}}"></span>
            <input th:name="${atributo.getNome()}" th:value="${atributo.getValor()}" required />
          </label>
        </div>
        <div>
          <button type="button">
            <a
              th:href="@{listagemEstudantes.html}"
              th:text="#{web.page.session-configuration.label.cancel}"
            ></a>
          </button>
          <button type="submit" th:text="#{web.page.session-configuration.label.save}"></button>
        </div>
      </form>
    </main>
  </body>
</html>
