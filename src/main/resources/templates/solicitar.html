<!doctype html>
<html lang="pt-br" xmlns="http://www.w3.org/1999/xhtml">
  <head>
    <!--suppress HtmlUnknownTag -->
    <th:block th:replace="~{fragments/head :: head}"></th:block>
    <link rel="stylesheet" th:href="@{/css/formulario.css}" />
    <link rel="stylesheet" th:href="@{/css/solicitar.css}" />
    <script th:src="@{/javascript/solicitar.js}" defer></script>
    <title th:text="#{web.page.request-password-change.title}"></title>
    <meta name="_csrf" th:content="${_csrf.token}" />
  </head>

  <body>
    <header>
      <!--/*@thymesVar id="programa" type="java.util.String"*/-->
      <h1 th:text="${programa}"></h1>
    </header>
    <main>
      <form action="/solicitar" method="post">
        <h2 th:text="#{web.page.request-password-change.label.token}"></h2>
        <div id="digitos-token">
          <label th:each="i : ${#numbers.sequence(0, 5)}">
            <input type="text" minlength="1" maxlength="1" required name="token[]" />
          </label>
        </div>
        <div id="botoes">
          <button type="button">
            <a href="/login" th:text="#{web.page.register.label.cancel}"></a>
          </button>
          <button
            type="submit"
            th:text="#{web.page.request-password-change.label.button.continue}"
            id="continuar"
          ></button>
        </div>
        <input th:name="${_csrf.parameterName}" th:value="${_csrf.token}" type="hidden" />
      </form>
    </main>
    <div th:replace="~{fragments/cookiesBanner :: #cookies-banner}"></div>
    <footer th:replace="~{fragments/licenseFooter :: footer}"></footer>
  </body>
</html>
